[package]
name = "receipt-core"
version = "0.1.0"
edition = "2021"
[lib]
crate-type = ["cdylib"]
[dependencies]
nusa-ai-detector = { path = "../.." }
wasm-bindgen = "=0.2.105"
serde_json = "=1.0.154"
unicode-normalization = "=0.1.24"
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
