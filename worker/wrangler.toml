name = "nusa-receipts-local"
main = "gateway.js"
compatibility_date = "2026-11-16"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
[assets]
directory = "../dist"
binding = "ASSETS"
run_worker_first = ["/api/*", "/receipt/*", "/verify/*"]
[[d1_databases]]
binding = "DB"
database_name = "nusa-receipts"
# LOCAL ONLY. Replace with actual D1 ID before remote deployment.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"
[observability]
enabled = false
[[durable_objects.bindings]]
name = "RECEIPT_PROCESSOR"
class_name = "ReceiptProcessor"
[[migrations]]
tag = "receipt-processor-v1"
new_sqlite_classes = ["ReceiptProcessor"]
[triggers]
crons = ["0 * * * *"]
