[package]
name = "nusa-ai-detector"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
leptos = { version = "=0.6.15", features = ["csr"] }
unicode-normalization = "=0.1.24"

wasm-bindgen = "=0.2.105"
wasm-bindgen-futures = "=0.4.55"
web-sys = { version = "=0.3.82", features = ["HtmlInputElement", "File", "FileList", "Blob"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
